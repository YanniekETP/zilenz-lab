name: Zilenz Lab tests
on:
  push:
    branches: [main, 'test/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run webshop tests
        run: node --test tests/shop.test.cjs
